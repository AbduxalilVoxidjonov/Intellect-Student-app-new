name: student
description: "Intellect Student — Intellect Kokand o'quv markazi o'quvchilari uchun ilova: davomat, baholar, onlayn testlar, to'lovlar, shartnoma va sertifikatlar."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
# DIQQAT: har bir Play Console'ga yuklanishda build raqami (+N) OSHISHI SHART —
# bir xil versionCode ikkinchi marta qabul qilinmaydi. Versiya nomi (1.0.0)
# o'zgarsa, lib/config.dart dagi kAppVersion ham shunga MOSLANSIN (ekranda ko'rinadi).
version: 1.0.0+2

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  dio: ^5.10.0
  go_router: ^17.3.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  fl_chart: ^1.2.0
  intl: ^0.20.3
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2
  image_picker: ^1.1.2
  # Sertifikat/hujjatni qurilmaga saqlash uchun (bog'liqliklar orqali allaqachon yechilgan).
  path_provider: ^2.1.6
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  # Push bildirishnoma (FCM). Konfiguratsiya: android/app/google-services.json.
  # Backend notification-message yuboradi, shuning uchun ilova FONDA bo'lganda
  # bannerni Android o'zi chiqaradi; OLDINDA bo'lganda flutter_local_notifications kerak.
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^22.2.0
  flutter_onnxruntime: ^1.8.3
  image: ^4.9.1
  # YUZ BILAN TASDIQLASH (kirish) — jonli kadr kerak: "tiriklik" harakatlari
  # (boshni burish, yaqinlashish) faqat KETMA-KET kadrlardan o'lchanadi, bitta
  # suratdan emas. Shu sabab image_picker YETMAYDI — u faqat tayyor rasm beradi.
  camera: ^0.12.0+2
  # Kamera ruxsati RAD ETILGAN holatni ajratish uchun: "so'ralmagan" bilan
  # "butunlay rad etilgan" farqlanmasa, foydalanuvchiga nima qilishni ayta
  # olmaymiz. `openAppSettings()` esa sozlamalarga o'tish tugmasini beradi.
  # ⚠️ iOS: Podfile'ga PERMISSION_CAMERA=1 makrosi qo'shilishi kerak (aks holda
  #    ishlatilmagan ruxsat kodlari ham kompilyatsiya qilinadi) — hozircha bu
  #    repoda iOS Podfile umuman yo'q, birinchi `pod install` da qo'shiladi.
  permission_handler: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  # Ilova ikonkasi va ochilish (splash) ekranini logodan generatsiya qiladi.
  # Qayta yaratish (logo o'zgarsa):
  #   dart run flutter_launcher_icons
  #   dart run flutter_native_splash:create
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  crypto: ^3.0.7

# ---------------------------------------------------------------------------
# ILOVA IKONKASI — Intellect Kokand logosi.
# Manba: assets/logo.png (to'liq kvadrat logo) — legacy Android va iOS ikonkasi.
# Adaptive ikonka (Android 8+) doira/squircle niqob qo'llaydi (ko'rinadigan qism —
# markazdagi 66%). DIQQAT: flutter_launcher_icons foreground'ga O'ZI 16% inset
# qo'shadi (mipmap-anydpi-v26/ic_launcher.xml), shuning uchun bu yerda TO'LDIRILMAGAN
# (to'liq kvadrat) logo beriladi — 100% × 68% ≈ 68%, ya'ni xavfsiz zonaga tushadi.
# Oldindan to'ldirilgan rasm berilsa ikkita to'ldirish qo'shilib, logo juda kichrayadi.
# Fon — logoning o'z rangi, shu sabab kvadrat chetlari umuman ko'rinmaydi.
# ---------------------------------------------------------------------------
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#020066"
  adaptive_icon_foreground: "assets/logo.png"
  # iOS ikonkasida shaffoflik BO'LMASLIGI kerak (App Store talabi).
  remove_alpha_ios: true

# ---------------------------------------------------------------------------
# OCHILISH EKRANI (native splash) — ilova ishga tushganda logo ko'rinadi.
# Fon logoning o'z ko'k rangi; rasm shaffof foreground (66%) — Android 12+ da
# splash ikonkasi ham doiraga niqoblanadi, shuning uchun bir xil xavfsiz zona.
# ---------------------------------------------------------------------------
flutter_native_splash:
  color: "#020066"
  color_dark: "#020066"
  image: assets/logo_foreground.png
  image_dark: assets/logo_foreground.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#020066"
    color_dark: "#020066"
    image: assets/logo_foreground.png
    image_dark: assets/logo_foreground.png
    icon_background_color: "#020066"
    icon_background_color_dark: "#020066"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/logo.png
    # YUZ TANISH modellari (telefonda ishlaydi — serverda 1 GB RAM).
    # Manba, litsenziya va sha256 — assets/models/README.md.
    # Jami ~9.7 MiB; kvantlangan (int8) SFace ATAYIN olingan: fp32 varianti 37 MiB.
    - assets/models/face_detection_yunet_2023mar.onnx
    - assets/models/face_recognition_sface_2021dec_int8.onnx

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
